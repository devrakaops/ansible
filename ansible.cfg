[defaults]
remote_user=ec2-user
inventory=/home/ec2-user/ansible/inventory
ask_pass = false
roles_path=/home/ec2-user/ansible/roles:/usr/share/ansible/roles
collections_path=/home/ec2-user/ansible/mycollections
host_key_checking = False
private_key_file = /home/ec2-user/private_key.pem


[privilege_escalation]
become = true
become_ask_pass = false
become_method = sudo
become_user = root


